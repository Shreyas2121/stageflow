# Include once inside the shared nginx http {} context. Replace __DOMAIN__.
# Keep the other applications' sites and the existing nginx service intact.
map $http_upgrade $stageflow_connection {
    default upgrade;
    '' close;
}
map $http_origin $stageflow_origin_allowed {
    default 0;
    '' 1;
    'https://__DOMAIN__' 1;
}
map $uri $stageflow_cache_control {
    default 'no-cache';
    ~^/assets/ 'public, max-age=31536000, immutable';
    ~^/(api|socket.io)/ 'private, no-store';
}
limit_conn_zone $server_name zone=stageflow_requests:1m;
limit_req_zone $binary_remote_addr zone=stageflow_rate:1m rate=10r/s;
# No query strings, cookies, Authorization, OAuth tickets, or request bodies.
log_format stageflow '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name __DOMAIN__;
    access_log /var/log/stageflow-nginx/access.log stageflow;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 308 https://__DOMAIN__$uri; }
}

server {
    listen 443 ssl;
    server_name __DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /opt/stageflow/current/apps/web/dist;
    access_log /var/log/stageflow-nginx/access.log stageflow;
    error_log /var/log/stageflow-nginx/error.log crit;

    # Default local-only trial. Add only invited test IPs before a restricted trial.
    include /etc/nginx/snippets/stageflow-allowlist.conf;
    if ($stageflow_origin_allowed = 0) { return 403; }
    limit_conn stageflow_requests 32;
    limit_conn_status 429;
    limit_req zone=stageflow_rate burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 2m;
    client_body_timeout 15s;
    keepalive_timeout 15s;
    send_timeout 15s;
    proxy_cache off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control $stageflow_cache_control always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss://__DOMAIN__; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /api/sessions/google/callback {
        # Nginx error messages can include the original query string.
        access_log off;
        error_log /dev/null;
        include /etc/nginx/snippets/stageflow-proxy.conf;
    }
    location ^~ /api/ {
        limit_rate 512k;
        include /etc/nginx/snippets/stageflow-proxy.conf;
    }
    location ^~ /socket.io/ {
        include /etc/nginx/snippets/stageflow-proxy.conf;
    }
    location /assets/ { try_files $uri =404; }
    location ^~ /media/ { return 404; }
    location ^~ /data/ { return 404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
