# Install once as /etc/systemd/system/stageflow-infra.service.d/ci-external.conf.
# Root must never execute helper code selected by an uploaded release.
[Service]
ExecStart=
ExecStart=/bin/sh /usr/local/lib/stageflow-ops/infra.sh start
ExecStop=
ExecStop=/bin/sh /usr/local/lib/stageflow-ops/infra.sh stop
